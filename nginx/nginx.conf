worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    upstream api_backend {
        server api:8080;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;

        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------------------------------------------------
        # OPTIONAL / DISABLED BY DEFAULT: URL masking via proxy_pass.
        #
        # This would proxy the destination site's content directly under
        # the short-URL path instead of issuing a 302 redirect, so the
        # short URL stays in the address bar. It is NOT enabled by default
        # because it breaks for any destination that sends its own
        # X-Frame-Options / Content-Security-Policy (frame-ancestors)
        # headers, or that relies on absolute/protocol-relative asset URLs
        # and JS bound to its real origin — see adr/0005 for the full
        # trade-off writeup. Do not enable without reviewing that ADR.
        #
        # location /m/ {
        #     resolver 1.1.1.1 8.8.8.8;
        #     proxy_pass https://$destination_host$request_uri;
        #     proxy_set_header Host $destination_host;
        #     proxy_hide_header X-Frame-Options;
        #     proxy_hide_header Content-Security-Policy;
        #     sub_filter_types text/html;
        #     sub_filter 'href="/' 'href="/m/';
        #     sub_filter_once off;
        # }
        # -----------------------------------------------------------------
    }
}
