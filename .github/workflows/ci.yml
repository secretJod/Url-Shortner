name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Hardcoded lowercase, NOT ghcr.io/${{ github.repository }}.
  #
  # `github.repository` is `secretJod/Url-Shortner` — mixed case. Docker image
  # references must be entirely lowercase, and docker/build-push-action does
  # not normalize this, so the interpolated form produced an invalid reference
  # and the push step could not publish the image.
  #
  # This value must stay byte-identical to the `image:` in
  # docker-compose.prod.yml, since deploy.yml pulls exactly what this pushes.
  # If the repo is ever renamed or moved, update both files together.
  IMAGE_NAME: ghcr.io/secretjod/url-shortner

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          # Caching disabled deliberately. The test job has failed on every
          # single run since the first commit, with "Run tests" as the exact
          # failing step — yet the same steps (mod download, go vet, go test
          # -race -v) reproduce clean, with zero failures, in a from-scratch
          # container on two different CPU architectures locally. The one
          # thing that can't be reproduced locally is GitHub's own module
          # cache, and this repo's go.mod has non-standard `replace`
          # directives pointing at GitHub mirror repos instead of the normal
          # module proxy — exactly the shape that can produce a stale/bad
          # cache entry that then gets reused on every later run. If
          # disabling this does NOT fix it, that rules this out and the
          # actual failure text from the Actions log is needed next.
          cache: false

      - name: Download Go modules
        working-directory: backend
        run: go mod download

      - name: Generate Prisma client
        working-directory: backend
        # ROOT CAUSE of every prior CI failure: internal/db/prisma_store.go
        # references types (PrismaClient, NewClient, Link, User, ...) that
        # only exist in Prisma's GENERATED output — backend/internal/db's own
        # .gitignore excludes `*_gen.go`, so a fresh checkout never has them.
        # Without this step, `internal/db` (and anything importing it,
        # including cmd/api) fails to even COMPILE, not just fails tests —
        # confirmed by cloning a fresh copy of this repo and reproducing the
        # exact "undefined: PrismaClient" build failure locally. `go test`
        # across the whole module still reports every OTHER package's real
        # test results before failing overall, which is what made this easy
        # to misread as a flaky/environment-specific test failure rather
        # than two packages refusing to build.
        #
        # prefetch downloads the query-engine binary for the runner's own
        # platform (linux/amd64 on ubuntu-latest); generate writes the client
        # into internal/db per schema.prisma's `output = "../internal/db"`.
        # Neither step needs a live database connection.
        run: |
          go run github.com/steebchen/prisma-client-go prefetch
          go run github.com/steebchen/prisma-client-go generate

      - name: Run tests
        working-directory: backend
        # -v: verbose per-test output, so a future failure's log is
        # immediately diagnosable without re-running anything.
        #
        # No `|| echo` fallback: a failing test must fail the job. The repo
        # has real tests (internal/auth, handlers, mail, redis, shortcode),
        # so swallowing the exit code meant a broken build could still be
        # tagged and pushed to GHCR, and then deployed by deploy.yml.
        run: go test ./... -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        # Needed to cross-build for linux/arm64 on this amd64 GitHub runner.
        # Without this, "Push image" below can only target the runner's own
        # architecture, and a pull from any arm64 deploy target (e.g. an
        # Apple Silicon Mac) fails with "no matching manifest for
        # linux/arm64/v8" — confirmed in practice: every official base image
        # here (postgres, redis, nginx, grafana, prometheus, golang) already
        # ships multi-arch, so only our own image was the problem.
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        # Smoke-test build only (push: false, load: true) — confirms
        # backend/Dockerfile still builds before anything is published.
        # Deliberately single-platform (the runner's own amd64): `load: true`
        # loads the result into the local Docker daemon for inspection, and
        # a multi-platform build produces a manifest LIST rather than a
        # single loadable image, which `load: true` cannot accept.
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci
          load: true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          # Published as a single multi-arch manifest list covering both
          # architectures — any deploy target (amd64 VM or arm64 Apple
          # Silicon Mac) pulls the same tag and transparently gets the right
          # variant; nothing downstream (docker-compose.prod.yml, deploy.yml)
          # needs to know or care which one.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
