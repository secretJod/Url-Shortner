name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Hardcoded lowercase, NOT ghcr.io/${{ github.repository }}.
  #
  # `github.repository` is `secretJod/Url-Shortner` — mixed case. Docker image
  # references must be entirely lowercase, and docker/build-push-action does
  # not normalize this, so the interpolated form produced an invalid reference
  # and the push step could not publish the image.
  #
  # This value must stay byte-identical to the `image:` in
  # docker-compose.prod.yml, since deploy.yml pulls exactly what this pushes.
  # If the repo is ever renamed or moved, update both files together.
  IMAGE_NAME: ghcr.io/secretjod/url-shortner

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Download Go modules
        working-directory: backend
        run: go mod download

      - name: Run tests
        working-directory: backend
        # No `|| echo` fallback: a failing test must fail the job. The repo has
        # real tests (internal/auth, handlers, mail, redis, shortcode), so
        # swallowing the exit code meant a broken build could still be tagged
        # and pushed to GHCR, and then deployed by deploy.yml.
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci
          load: true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
