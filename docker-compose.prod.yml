# Production hardening overrides.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file is layered ON TOP of docker-compose.yml (the dev-friendly
# default). It does NOT change docker-compose.yml, so `docker compose up`
# on its own is unaffected and local dev keeps working exactly as before.
#
# What this file changes, and why:
#
# 1. Removes host port publishing for postgres, redis, prometheus, grafana,
#    and api. On a public VM those ports would expose an unauthenticated
#    database, cache, metrics/dashboard surface, and app server directly
#    to the internet. All of these services are reachable by every other
#    container over the default Docker network via their service name
#    (postgres:5432, redis:6379, prometheus:9090, api:8080 — see
#    nginx/nginx.conf's `upstream api_backend { server api:8080; }`) —
#    nothing else needs the host port mapping. Only nginx (80/443) stays
#    published, since that's the one thing that's supposed to be public.
#
# 2. Replaces the hardcoded Postgres password with a required environment
#    variable (${POSTGRES_PASSWORD:?...}). Compose's `:?` syntax fails
#    the `up`/`config` command immediately with an error if the variable
#    isn't set, instead of silently falling back to a default — so a
#    missing secret is a loud deploy-time failure, not a quiet security
#    hole. The value is expected to come from the environment (e.g. a
#    GitHub Actions secret exported before `docker compose up`).
#
# 3. KEEPS MailHog running, but unpublished. This reverses the usual rule
#    and is deliberate — see the long comment on the `mailhog` service
#    below for the trade-offs. In short: mail is never delivered
#    externally; an admin reads verification links out of MailHog over an
#    SSH tunnel and relays the code by hand. Setting SMTP_HOST/SMTP_PORT/
#    SMTP_USER/SMTP_PASSWORD switches to a real relay with no code change.
#    `ports: !reset []` on that service is load-bearing security, not
#    tidiness.
#
# 4. Disables the automatic `migrate` service (`prisma db push` on every
#    boot). `db push` reconciles the live schema to match the Prisma
#    schema file with NO migration history and NO rollback path — on a
#    database that only has throwaway dev data that's an acceptable
#    convenience, but against production data it is a real risk: a
#    column rename, drop, or type change can silently destroy or corrupt
#    data on every single deploy, with nothing to revert to. This repo
#    has no migration system (no `prisma migrate` history checked in), so
#    building one is out of scope here. The minimal, safe choice is to
#    NOT auto-run it in production: this override replaces the `migrate`
#    command with a no-op that exits 0 immediately (so `api`'s
#    `depends_on: migrate: condition: service_completed_successfully`
#    is still satisfied and the stack still comes up), and schema changes
#    must instead be applied deliberately and reviewed — e.g. by running
#    `docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm migrate-apply`
#    (see the `migrate` service below for the real command, commented)
#    or a proper migration tool, as a conscious, separate step.

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}"

  redis:
    ports: !reset []

  # MailHog DOES run in production in the current operating mode — a
  # deliberate reversal of the usual "never run a dev mail catcher in prod"
  # rule, made with the trade-offs understood:
  #
  #   - No mail is ever delivered externally. An admin reads the
  #     verification link out of MailHog by hand and passes the code to the
  #     user. That does not scale, but it needs no external mail provider.
  #   - `ports: !reset []` is MANDATORY and is the actual security control
  #     here. MailHog's web UI (8025) lists every verification link for every
  #     user — publishing it would let anyone who reaches this host claim any
  #     account. Unpublished, it exists only on the internal Docker network
  #     and is unreachable from outside regardless of who knows the port
  #     number. Reach it deliberately instead:
  #         ssh -L 8025:localhost:8025 <user>@<host>   # then open localhost:8025
  #     Never proxy 8025 through nginx or expose it via a tunnel.
  #   - MailHog holds messages in memory, so a restart drops any unread
  #     verification mail. Tokens are short-lived anyway (see
  #     internal/handlers/apikeys.go), so the user simply requests another.
  #
  # To switch to a real relay, set SMTP_HOST/SMTP_PORT/SMTP_USER/
  # SMTP_PASSWORD (see the api service below) — internal/mail/mail.go then
  # takes its STARTTLS + AUTH PLAIN path automatically. No code change.
  mailhog:
    ports: !reset []

  # Schema push is NOT safe to run unattended against production data
  # (see header comment). Replace the real command with a no-op so the
  # `api` service's `depends_on: service_completed_successfully` check
  # still passes and the stack starts, without ever touching the schema.
  migrate:
    environment:
      DATABASE_URL: "postgresql://urlshortener:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}@postgres:5432/urlshortener?schema=public"
    command: sh -c "echo 'Skipping automatic schema push in production. Apply schema changes deliberately — see docker-compose.prod.yml.' && exit 0"

  api:
    # `docker-compose.yml` builds this service locally (`build:
    # backend/Dockerfile`). In production we instead deploy the exact image
    # ci.yml already built and pushed to GHCR for this commit — rebuilding
    # the Node+Go+Prisma multi-stage image on every deploy host would be
    # slower, and could drift from what CI actually tested. `build: !reset
    # null` removes the inherited `build:` section entirely (verified with
    # `docker compose config` — see DEPLOY.md) so `docker compose pull`/`up`
    # never tries to build and always pulls `image:` below instead. Note:
    # ghcr.io requires an all-lowercase image path even though the GitHub
    # org is `secretJod` — hence `secretjod` here, not the repository's own
    # casing.
    build: !reset null
    image: "ghcr.io/secretjod/url-shortner:${IMAGE_TAG:-latest}"
    # Least privilege: docker-compose.yml gives api `env_file: - .env`, which
    # loads the WHOLE file into the container's process environment. In dev
    # that file holds only placeholders, but in production deploy.yml
    # consolidates every secret in the system into it — including Grafana's
    # admin password, which api neither reads nor should ever hold. Anything
    # that can read this process's environment (a dependency vulnerability, an
    # env-dumping debug path, a crash reporter) would otherwise get the whole
    # set. Reset it and pass only what api actually needs, explicitly, below.
    env_file: !reset []
    # nginx (published on 80/443) proxies to the api container over the
    # internal Docker network (see nginx/nginx.conf: `server api:8080`).
    # There's no reason for 8080 to also be reachable directly from the
    # host/internet in production.
    ports: !reset []
    environment:
      # ENV reached the container via `env_file: .env` until that was reset
      # above, so it must be set explicitly here. This is what activates
      # config.go's validateForProduction() placeholder-secret guard —
      # without it, that guard is dead code and the app boots happily on
      # committed dev credentials.
      ENV: "production"
      DATABASE_URL: "postgresql://urlshortener:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}@postgres:5432/urlshortener?schema=public"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set in production}"
      IP_HASH_SECRET: "${IP_HASH_SECRET:?IP_HASH_SECRET must be set in production}"
      # Mail: defaults target the in-network MailHog catcher (current
      # operating mode — see the mailhog service above). These are NOT
      # required vars: an unset or empty SMTP_USER/SMTP_PASSWORD is what
      # selects mail.go's unauthenticated path, so `:?` would be wrong here
      # (it rejects empty as well as unset and would hard-fail the deploy).
      # Set all four to real values to switch to an authenticated relay.
      SMTP_HOST: "${SMTP_HOST:-mailhog}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:?MAIL_FROM must be set in production}"
      BASE_URL: "${BASE_URL:?BASE_URL must be set in production}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Note: docker compose merges depends_on by key across files, so the
      # base file's `mailhog: condition: service_started` entry still
      # applies here too. That's harmless: mailhog is redefined above as a
      # no-op that starts and immediately exits 0, which satisfies
      # "service_started" right away.

  nginx:
    ports:
      - "80:80"
      - "443:443"

  prometheus:
    ports: !reset []

  grafana:
    ports: !reset []
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set in production}
      - GF_USERS_ALLOW_SIGN_UP=false
